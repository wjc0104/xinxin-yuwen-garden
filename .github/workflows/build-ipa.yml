name: Build TrollStore IPA
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Domain and catalog checks
        run: |
          swift test
          python3 scripts/check-catalog.py
          python3 scripts/check-library.py
          python3 scripts/test-text-sources.py
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build native arm64 app
        run: xcodebuild build -project XinxinGarden.xcodeproj -scheme XinxinGarden -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
      - name: Ad-hoc sign and package for TrollStore
        run: bash scripts/package-ipa.sh
      - name: Verify packaged IPA contents
        run: |
          for ipa in build/*.ipa; do
            python3 scripts/inspect-ipa.py "$ipa" --report build/ipa-report.json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: XinxinGarden-TrollStore
          path: |
            build/*.ipa
            build/SHA256SUMS.txt
            build/package-verification.json
            build/ipa-inspection.json
            build/ipa-report.json
            build/device-load-commands.txt
            build/entitlements.plist
          retention-days: 14
