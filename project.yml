name: XinxinGarden
options:
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
packages:
  GardenCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  XinxinGarden:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 欣语
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations: [zh_CN]
        CFBundleShortVersionString: '0.0.2'
        CFBundleVersion: '2'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCalendarsUsageDescription: 仅在你主动清除旧版课程提醒时访问日历，避免旧版和 Bark 重复提醒。
        NSCalendarsFullAccessUsageDescription: 仅用于移除旧版由欣语创建的课程提醒，不编辑其他日历。
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wm0104.xinxingarden
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GardenCore
        product: GardenCore
  GardenAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wm0104.xinxingarden.apptests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/XinxinGarden.app/XinxinGarden
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: XinxinGarden
  GardenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wm0104.xinxingarden.uitests
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: XinxinGarden
    dependencies:
      - target: XinxinGarden
schemes:
  XinxinGarden:
    build:
      targets:
        XinxinGarden: all
    test:
      targets: [GardenAppTests, GardenUITests]
